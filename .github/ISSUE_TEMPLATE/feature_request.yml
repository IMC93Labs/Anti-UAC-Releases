name: Request an improvement / Solicitar una mejora
description: Suggest a feature or improvement for Anti-UAC / Sugiere una función o mejora para Anti-UAC
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome when they improve Anti-UAC's usability, reliability or safety.
        Las sugerencias son bienvenidas cuando mejoren la facilidad de uso, fiabilidad o seguridad de Anti-UAC.

        **Personal hobby project / Proyecto personal:** Anti-UAC is developed in free time through AI-assisted vibe coding. There is no guarantee that a suggestion can be implemented.

        Requests whose main purpose is to weaken Windows security globally, bypass organizational security policy or run untrusted software with elevated privileges are outside the scope of this project.

  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement / Mejora propuesta
      description: What would you like to add or change? / ¿Qué te gustaría añadir o cambiar?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need / Problema o necesidad
      description: What problem would this solve or what would it improve? / ¿Qué problema resolvería o qué mejoraría?
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: Desired behaviour / Funcionamiento deseado
      description: Describe how you would expect it to work. / Describe cómo te gustaría que funcionara.

  - type: textarea
    id: additional
    attributes:
      label: Additional context / Información adicional
      description: Add examples or screenshots if useful and non-sensitive. / Añade ejemplos o capturas si resultan útiles y no contienen información sensible.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks / Comprobaciones
      options:
        - label: I searched existing Issues for a similar suggestion. / He buscado si ya existe una sugerencia similar en Issues.
          required: true
        - label: This request is for legitimate use with trusted software. / Esta solicitud es para un uso legítimo con software de confianza.
          required: true
        - label: I have not included credentials, private keys or personal information. / No he incluido credenciales, claves privadas ni información personal.
          required: true
