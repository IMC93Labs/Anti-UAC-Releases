name: Report a bug / Reportar un problema
description: Report unexpected behaviour in Anti-UAC / Informa de un error o comportamiento inesperado
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
        Gracias por dedicar tiempo a informar de un problema.

        **Personal hobby project / Proyecto personal:** Anti-UAC is developed in free time through AI-assisted vibe coding and is provided as-is, without guarantees.
        Anti-UAC se desarrolla en el tiempo libre mediante vibe coding asistido por IA y se proporciona tal cual, sin garantías.

        Only use Anti-UAC with applications you trust. Do not include passwords, tokens, private keys, sensitive system information or confidential executables in this report.
        Utiliza Anti-UAC únicamente con aplicaciones de confianza. No incluyas contraseñas, tokens, claves privadas, información sensible del sistema ni ejecutables confidenciales en este reporte.

        Read / Lee: [Disclaimer / Aviso y responsabilidad](https://github.com/IMC93Labs/Anti-UAC-Releases/blob/main/DISCLAIMER.md)

  - type: input
    id: version
    attributes:
      label: Anti-UAC version / Versión de Anti-UAC
      placeholder: "e.g. / ej. v1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version / Versión de Windows
      placeholder: "e.g. / ej. Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Target type / Tipo de destino
      options:
        - Executable / Ejecutable
        - Shortcut / Acceso directo
        - Script or launcher / Script o lanzador
        - Other / Otro
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened? / ¿Qué ha ocurrido?
      description: Describe the problem clearly without including sensitive data. / Describe el problema de forma clara sin incluir datos sensibles.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducirlo
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour / Comportamiento esperado
      description: What should have happened? / ¿Qué debería haber ocurrido?

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility / Frecuencia
      options:
        - Always / Siempre
        - Sometimes / A veces
        - Happened once / Ha ocurrido una vez
        - Not sure / No estoy seguro
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information / Información adicional
      description: Add screenshots or logs only if they contain no sensitive information. / Añade capturas o registros solo si no contienen información sensible.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks / Comprobaciones
      options:
        - label: I searched existing Issues for the same problem. / He buscado si ya existe un Issue sobre el mismo problema.
          required: true
        - label: The configured application is software I trust. / La aplicación configurada es software en el que confío.
          required: true
        - label: I have not included credentials, private keys, sensitive system information or confidential files. / No he incluido credenciales, claves privadas, información sensible del sistema ni archivos confidenciales.
          required: true
